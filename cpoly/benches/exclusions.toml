# Mirrored items that deliberately have no benchmark.
#
# `make bench-coverage` requires every item in `cpoly/src` whose docstring says
# `Mirrors CompPoly.X` to be either benched or listed here. Silence is not an
# exclusion: an operation nobody measures is one the optimization loop cannot
# notice a regression in, and "we forgot" and "it is not worth measuring" must
# not look the same from the outside.
#
# The bar for adding a line here is that a criterion run on the item would
# measure the harness rather than the item -- a type with no runtime, or a
# constant the compiler folds. It is NOT "this seemed slow to benchmark" or
# "this is not on the hot path". If an item does real work at any size, bench it.
#
# Each entry must say *why*, in a form that can be checked by reading the item.

[exclusions]

# -- types ------------------------------------------------------------------
#
# A struct declaration has no runtime. The operations over these types are
# benched individually; the type itself cannot be.

"field::Ext4" = "a type declaration, not code — its operations are benched separately"
"univariate::UnivariatePoly" = "a type declaration, not code"
"multilinear::MultilinearPoly" = "a type declaration, not code"
"multilinear::MultilinearEvals" = "a type declaration, not code"

# -- constants ---------------------------------------------------------------
#
# These are `const` items that rustc materialises at compile time. A bench would
# time `black_box` and nothing else.

"field::W" = "a compile-time constant (Fp(2)); there is no code to run"
"field::Ext4::GEN" = "a compile-time constant; pins the basis convention, never computed"

# `mul_by_w` is an internal reduction step, not an external API. Its cost is
# included in both the general-product and square cases below.
"field::mul_by_w" = "private; measured through `Ext4::mul` and `Ext4::square` rows"

# -- O(1) by inspection ------------------------------------------------------

"multilinear::table_len" = """
a single `1usize << vars`. One shift instruction, and every caller of it is
already benched at the size it produces, so a regression here is unmissable
there. Benching it would measure the black_box around it."""

# -- genesis-only exclusions -------------------------------------------------
#
# A later optimization can introduce a private helper that did not exist in
# the frozen implementation of its public caller. The caller's frozen body is
# already the complete baseline, so copying the new helper into genesis would
# create an artificial item with no baseline to measure. `check-genesis`
# accepts only private functions and compile-time constants in this table,
# rejects stale entries, and rejects an exclusion once a frozen counterpart
# exists. A new private constant is no more a standalone workload than a new
# helper function: its value is already reflected in the public operation that
# uses it.

[genesis_exclusions]
"field::reduce_wide" = "private reduction used only by the optimized `Ext4::mul`; the frozen product has no such helper"
"field::add_product" = "private accumulator step used only by the optimized `Ext4::mul`; measured through that public row"
"field::add_double_product" = "private doubled accumulator step used only by the optimized `Ext4::mul`; measured through that public row"
"field::add_quadruple_product" = "private fourfold accumulator step introduced for optimized `Ext4::square`; measured through that public row"
"univariate::R64" = "private compile-time reduction constant used only by optimized univariate multiplication; no standalone runtime workload"
"univariate::KARATSUBA_CUTOFF" = "private compile-time tuning constant used only by optimized univariate multiplication; no standalone runtime workload"
"univariate::reduce_u128" = "private delayed-reduction helper introduced by optimized univariate multiplication; measured through the public multiplication row"
"univariate::conv_delayed" = "private schoolbook leaf introduced by optimized univariate multiplication; measured through the public multiplication row"
"univariate::add_slices" = "private Karatsuba sum helper introduced by optimized univariate multiplication; measured through the public multiplication row"
"univariate::mul_karatsuba" = "private recursive multiplication helper introduced by optimized univariate multiplication; measured through the public multiplication row"
